<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#651f31"/>
<title>Ayaz & Sadia — Wedding Invitation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Playfair+Display:wght@400;500;600&display=swap');

:root {
  --ivory:#f7f0e6;--cream:#eee0d2;--paper:#fffaf2;
  --ink:#3b1622;--muted:#684b53;--wine:#74192f;--wine-dark:#43101f;
  --wine-mid:#8b2943;--sage:#66705b;--sage-dark:#3f493b;
  --gold:#b78b42;--gold-light:#d9bd7e;--line:rgba(116,25,47,.28);
  --shadow:0 15px 35px rgba(67,16,31,.18);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden !important;
  background: #3d1722;
  color: var(--ink);
  font-family: 'Playfair Display', serif;
  touch-action: none;
}

.page {
  position: relative;
  width: 100%;
  max-width: 480px;
  height: 100vh;
  margin: auto;
  background: var(--ivory);
  overflow: hidden;
  box-shadow: 0 0 50px rgba(48,34,17,.15);
}

.page:before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .18;
  background-image: radial-gradient(rgba(120,95,55,.16) .65px, transparent .65px);
  background-size: 12px 12px;
}

.petals, .motion-leaves, .ambient {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  transform: translateZ(0);
}
.petals { z-index: 90; }
.motion-leaves { z-index: 91; }
.ambient { z-index: 89; }

.petal {
  position: absolute;
  top: -24px;
  left: var(--x);
  width: var(--w);
  height: var(--h);
  border-radius: 80% 20% 80% 20%;
  background: var(--c);
  opacity: var(--o);
  animation: fall var(--dur) linear var(--delay) infinite;
  will-change: transform;
}

@keyframes fall {
  0% { transform: translate3d(0,-30px,0) rotate(var(--rot)) scale(.8); }
  50% { transform: translate3d(calc(var(--drift)*.5),55vh,0) rotate(calc(var(--rot) + 200deg)) scale(1); }
  100% { transform: translate3d(var(--drift),110vh,0) rotate(calc(var(--rot) + 400deg)) scale(.9); }
}

.motion-leaf {
  position: absolute;
  top: -8vh;
  left: var(--x);
  width: var(--w);
  height: var(--h);
  border-radius: 80% 20% 80% 20%;
  background: var(--c);
  opacity: var(--o);
  animation: cinematicLeaf var(--dur) linear var(--delay) infinite;
  will-change: transform, opacity;
}

@keyframes cinematicLeaf {
  0% { transform: translate3d(0,-10vh,0) rotate(0deg); opacity: 0; }
  15% { opacity: var(--o); }
  85% { opacity: var(--o); }
  100% { transform: translate3d(var(--drift),112vh,0) rotate(360deg); opacity: 0; }
}

.orb {
  position: absolute;
  width: 160px;
  height: 160px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(183,139,66,.18), rgba(116,25,47,.04) 50%, transparent 70%);
  animation: orbFloat 12s ease-in-out infinite alternate;
  will-change: transform;
}
.orb:nth-child(2) { width: 200px; height: 200px; animation-duration: 16s; }

@keyframes orbFloat {
  from { transform: translate3d(-10px,10px,0); }
  to { transform: translate3d(20px,-20px,0); }
}

#opening {
  height: 100vh;
  padding: 0;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 50% 20%,#fffdf7 0,#f6ede0 48%,#ead9cf 100%);
}

.opening-inner { width: 100%; height: 100%; position: relative; display: grid; place-items: center; }

.opening-card {
  width: min(84%,390px);
  height: 580px;
  position: relative;
  perspective: 1000px;
  cursor: pointer;
  animation: openingFloat 5s ease-in-out infinite;
  will-change: transform;
}

@keyframes openingFloat {
  0%,100% { transform: translate3d(0,0,0); }
  50% { transform: translate3d(0,-6px,0); }
}

.envelope {
  position: absolute;
  inset: 11% 4% 8%;
  background: linear-gradient(145deg,#fffdf7,#f0dfd4);
  border: 1px solid rgba(116,25,47,.28);
  box-shadow: var(--shadow);
  overflow: hidden;
  z-index: 2;
}

.flap {
  position: absolute;
  left: 4%; right: 4%; top: 11%;
  height: 48%;
  background: linear-gradient(145deg,#fffdf8,#ead7ce);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  border: 1px solid rgba(116,25,47,.26);
  transform-origin: top;
  transition: transform 0.8s ease-out;
  z-index: 5;
  will-change: transform;
}

.opening-card.open .flap { transform: rotateX(170deg); }

.seal {
  position: absolute;
  z-index: 7;
  left: 50%; top: 49%;
  transform: translate(-50%,-50%);
  width: 66px; height: 66px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 25%,#e2d29f,#b0924e 65%,#79622f);
  box-shadow: 0 6px 16px rgba(67,16,31,.22);
  display: grid;
  place-items: center;
  color: #fff9e9;
  font-family: 'Great Vibes', cursive;
  font-size: 28px;
  border: 2px solid #d8c389;
  transition: transform .6s, opacity .4s;
}

.opening-card.open .seal {
  transform: translate(-50%,-50%) scale(.2);
  opacity: 0;
}

.opening-copy {
  position: absolute;
  z-index: 4;
  inset: 16% 11% 15%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.opening-copy h1 {
  font: 52px 'Great Vibes', cursive;
  margin: 8px 0;
  color: var(--wine);
}

.opening-copy p { margin: 0; color: #a08b61; letter-spacing: 3px; font-size: 9px; }
.opening-copy .bismillah { font-size: 20px; color: var(--wine-dark); margin-bottom: 20px; }
.opening-copy .date { font-size: 10px; letter-spacing: 2px; margin-top: 16px; }

.tap {
  position: absolute;
  z-index: 8;
  bottom: 14%;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 16px;
  border-radius: 99px;
  border: 1px solid rgba(116,25,47,.32);
  background: rgba(255,250,243,.94);
  color: var(--wine);
  letter-spacing: 3px;
  font-size: 10px;
  font-family: inherit;
  cursor: pointer;
  font-weight: 600;
}
.tap span { display: block; margin-top: 4px; font-size: 16px; animation: bob 1.4s infinite; }
@keyframes bob { 50% { transform: translateY(4px); } }

.music {
  position: fixed;
  right: 15px;
  bottom: 17px;
  z-index: 90;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid rgba(116,25,47,.34);
  background: rgba(255,248,237,.96);
  color: var(--wine);
  box-shadow: 0 4px 14px rgba(67,16,31,.15);
  cursor: pointer;
}
</style>
</head>
<body>

<div class="petals" aria-hidden="true"></div>
<div class="ambient" aria-hidden="true">
  <i class="orb" style="left:-40px;top:10%"></i>
  <i class="orb" style="right:-50px;top:50%"></i>
</div>
<div class="motion-leaves" aria-hidden="true"></div>

<div class="page">
  <section id="opening">
    <div class="opening-inner">
      <div class="opening-card" id="envelope">
        <div class="envelope"></div>
        <div class="flap"></div>
        <div class="opening-copy">
          <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>
          <p>WITH THEIR FAMILIES</p>
          <h1>Ayaz &amp; Sadia</h1>
          <p class="date">27 OCTOBER 2026 · THAKURDWARA</p>
        </div>
        <div class="seal">A</div>
        <button class="tap" id="openBtn">TAP TO OPEN<span>⌄</span></button>
      </div>
    </div>
  </section>
</div>

<button class="music" id="musicBtn" aria-label="Music control">♪</button>

<script>
const $ = s => document.querySelector(s);

const petalPalette = ['rgba(116,25,47,.5)','rgba(145,38,61,.4)','rgba(188,145,69,.45)','rgba(225,197,129,.35)'];
for(let i=0; i<20; i++){
  const p = document.createElement('i');
  p.className = 'petal';
  p.style.setProperty('--x', (Math.random()*100)+'%');
  p.style.setProperty('--w', (6+Math.random()*6)+'px');
  p.style.setProperty('--h', (9+Math.random()*8)+'px');
  p.style.setProperty('--c', petalPalette[i%petalPalette.length]);
  p.style.setProperty('--o', (0.6+Math.random()*.35).toFixed(2));
  p.style.setProperty('--dur', (7+Math.random()*8).toFixed(2)+'s');
  p.style.setProperty('--delay', (-Math.random()*10).toFixed(2)+'s');
  p.style.setProperty('--rot', (Math.random()*180).toFixed(1)+'deg');
  p.style.setProperty('--drift', ((-50)+Math.random()*100).toFixed(1)+'px');
  $('.petals').appendChild(p);
}

const leafPalette = ['rgba(116,25,47,.75)','rgba(145,38,61,.65)','rgba(188,145,69,.7)'];
for(let i=0; i<12; i++){
  const l = document.createElement('i');
  l.className = 'motion-leaf';
  l.style.setProperty('--x', (Math.random()*100)+'%');
  l.style.setProperty('--w', (8+Math.random()*8)+'px');
  l.style.setProperty('--h', (12+Math.random()*12)+'px');
  l.style.setProperty('--c', leafPalette[i%leafPalette.length]);
  l.style.setProperty('--o', (0.6+Math.random()*.3).toFixed(2));
  l.style.setProperty('--dur', (8+Math.random()*7).toFixed(2)+'s');
  l.style.setProperty('--delay', (-Math.random()*10).toFixed(2)+'s');
  l.style.setProperty('--drift', ((-60)+Math.random()*120).toFixed(1)+'px');
  $('.motion-leaves').appendChild(l);
}

$('#openBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  $('#envelope').classList.add('open');
});

$('#musicBtn').addEventListener('click', () => alert('Music playback ready.'));
</script>
</body>
</html>
